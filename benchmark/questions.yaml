- id: win_01
  category: window
  question: "Ποιες 3 ημέρες είχαν τη μεγαλύτερη αύξηση μέσης θερμοκρασίας σε σχέση με την προηγούμενη ημέρα;"
  gold_sql: "SELECT to_char(d, 'YYYY-MM-DD') AS day FROM (SELECT DATE_TRUNC('day', ts) AS d, AVG(temperature) - LAG(AVG(temperature)) OVER (ORDER BY DATE_TRUNC('day', ts)) AS delta FROM factory_telemetry_fixed GROUP BY DATE_TRUNC('day', ts)) t WHERE delta IS NOT NULL ORDER BY delta DESC LIMIT 3;"
  result_check: ordered
  note: "Compare on the 3 days only — the delta value is sensitive to rounding order (round-then-diff vs diff-then-round)."

- id: win_02
  category: window
  question: "Για κάθε τύπο μηχανής, ποια μηχανή έχει τη μεγαλύτερη συνολική κατανάλωση ενέργειας;"
  gold_sql: "SELECT machine_name FROM (SELECT machine_name, RANK() OVER (PARTITION BY machine_type ORDER BY SUM(energy_consumption) DESC) rnk FROM factory_telemetry_fixed GROUP BY machine_name, machine_type) t WHERE rnk = 1 ORDER BY machine_name;"
  result_check: set

- id: win_03
  category: window
  question: "Τι ποσοστό της συνολικής κατανάλωσης ενέργειας αντιστοιχεί σε κάθε τύπο μηχανής;"
  gold_sql: "SELECT machine_type, ROUND((SUM(energy_consumption) * 100.0 / SUM(SUM(energy_consumption)) OVER ())::numeric, 2) AS pct FROM factory_telemetry_fixed GROUP BY machine_type ORDER BY machine_type;"
  result_check: set

- id: win_04
  category: window
  question: "Ποια μηχανή έχει τη 2η μεγαλύτερη μέγιστη θερμοκρασία;"
  gold_sql: "SELECT machine_name, ROUND(mx::numeric, 2) AS max_temp FROM (SELECT machine_name, MAX(temperature) mx, ROW_NUMBER() OVER (ORDER BY MAX(temperature) DESC) rn FROM factory_telemetry_fixed GROUP BY machine_name) t WHERE rn = 2;"
  result_check: ordered

- id: win_05
  category: window
  question: "Για κάθε μηχανή, πόσο διαφέρει η συνολική της κατανάλωση ενέργειας από τον μέσο όρο του τύπου της;"
  gold_sql: "SELECT machine_name, ROUND((SUM(energy_consumption) - AVG(SUM(energy_consumption)) OVER (PARTITION BY machine_type))::numeric, 2) AS diff FROM factory_telemetry_fixed GROUP BY machine_name, machine_type ORDER BY machine_name;"
  result_check: set

- id: sub_01
  category: subquery
  question: "Ποιες μηχανές έχουν συνολική κατανάλωση ενέργειας πάνω από τον μέσο όρο του τύπου τους;"
  gold_sql: "SELECT m.machine_name FROM (SELECT machine_name, machine_type, SUM(energy_consumption) total FROM factory_telemetry_fixed GROUP BY 1, 2) m WHERE m.total > (SELECT AVG(t.total) FROM (SELECT machine_name, machine_type, SUM(energy_consumption) total FROM factory_telemetry_fixed GROUP BY 1, 2) t WHERE t.machine_type = m.machine_type) ORDER BY 1;"
  result_check: set

- id: sub_02
  category: subquery
  question: "Ποιες μηχανές δεν είχαν ποτέ καταγεγραμμένη ανωμαλία;"
  gold_sql: "SELECT DISTINCT machine_name FROM factory_telemetry_fixed f WHERE NOT EXISTS (SELECT 1 FROM factory_telemetry_fixed a WHERE a.machine_id = f.machine_id AND a.anomaly_flag = 1) ORDER BY machine_name;"
  result_check: set
  note: "Correct answer is an EMPTY set — every machine has at least one anomaly. Tests handling of a legitimately empty result."

- id: sub_03
  category: subquery
  question: "Για κάθε τύπο μηχανής, ποια μηχανή έχει τη μεγαλύτερη μέση θερμοκρασία;"
  gold_sql: "SELECT machine_name FROM (SELECT DISTINCT ON (machine_type) machine_type, machine_name FROM (SELECT machine_type, machine_name, AVG(temperature) a FROM factory_telemetry_fixed GROUP BY 1, 2) t ORDER BY machine_type, a DESC) x ORDER BY machine_name;"
  result_check: set

- id: sub_04
  category: subquery
  question: "Πόσες μηχανές έχουν προβλεπόμενη υπολειπόμενη ζωή (στην τελευταία τους μέτρηση) κάτω από τη διάμεσο όλων;"
  gold_sql: "SELECT COUNT(*) AS n FROM (SELECT predicted_remaining_life prl FROM factory_telemetry_fixed WHERE ts IN (SELECT MAX(ts) FROM factory_telemetry_fixed GROUP BY machine_id)) m WHERE prl < (SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY predicted_remaining_life) FROM (SELECT predicted_remaining_life FROM factory_telemetry_fixed WHERE ts IN (SELECT MAX(ts) FROM factory_telemetry_fixed GROUP BY machine_id)) x);"
  result_check: scalar

- id: sub_05
  category: subquery
  question: "Ποια είναι η διάμεσος (median) θερμοκρασία ανά τύπο μηχανής;"
  gold_sql: "SELECT machine_type, ROUND(PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY temperature)::numeric, 2) AS median_temp FROM factory_telemetry_fixed GROUP BY machine_type ORDER BY machine_type;"
  result_check: set
