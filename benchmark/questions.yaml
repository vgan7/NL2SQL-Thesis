- id: simple_01
  category: simple
  question: "Πόσες εγγραφές υπάρχουν συνολικά;"
  gold_sql: "SELECT COUNT(*) AS n FROM factory_telemetry_fixed;"
  result_check: scalar

- id: simple_02
  category: simple
  question: "Πόσες διαφορετικές μηχανές υπάρχουν;"
  gold_sql: "SELECT COUNT(DISTINCT machine_id) AS n FROM factory_telemetry_fixed;"
  result_check: scalar

- id: simple_03
  category: simple
  question: "Ποιοι είναι οι τύποι μηχανών;"
  gold_sql: "SELECT DISTINCT machine_type FROM factory_telemetry_fixed ORDER BY machine_type;"
  result_check: set

- id: agg_01
  category: aggregation
  question: "Ποια είναι η μέση θερμοκρασία;"
  gold_sql: "SELECT ROUND(AVG(temperature)::numeric, 2) AS avg_temperature FROM factory_telemetry_fixed;"
  result_check: scalar

- id: agg_02
  category: aggregation
  question: "Ποια είναι η μέγιστη κατανάλωση ενέργειας που έχει καταγραφεί;"
  gold_sql: "SELECT ROUND(MAX(energy_consumption)::numeric, 2) AS max_energy FROM factory_telemetry_fixed;"
  result_check: scalar

- id: agg_03
  category: aggregation
  question: "Ποια η ελάχιστη και ποια η μέγιστη πίεση;"
  gold_sql: "SELECT ROUND(MIN(pressure)::numeric, 2) AS min_pressure, ROUND(MAX(pressure)::numeric, 2) AS max_pressure FROM factory_telemetry_fixed;"
  result_check: scalar

- id: agg_04
  category: aggregation
  question: "Πόσες ανωμαλίες έχουν καταγραφεί συνολικά;"
  gold_sql: "SELECT COUNT(*) AS anomalies FROM factory_telemetry_fixed WHERE anomaly_flag = 1;"
  result_check: scalar

- id: group_01
  category: group_sort
  question: "Μέση θερμοκρασία ανά τύπο μηχανής, από την υψηλότερη στη χαμηλότερη."
  gold_sql: "SELECT machine_type, ROUND(AVG(temperature)::numeric, 2) AS avg_temperature FROM factory_telemetry_fixed GROUP BY machine_type ORDER BY avg_temperature DESC;"
  result_check: ordered

- id: group_02
  category: group_sort
  question: "Συνολική κατανάλωση ενέργειας ανά τύπο μηχανής."
  gold_sql: "SELECT machine_type, ROUND(SUM(energy_consumption)::numeric, 2) AS total_energy FROM factory_telemetry_fixed GROUP BY machine_type ORDER BY total_energy DESC;"
  result_check: set

- id: group_03
  category: group_sort
  question: "Ποιες είναι οι 5 μηχανές με τις περισσότερες ανωμαλίες σε όλη την περίοδο;"
  gold_sql: "SELECT machine_name FROM factory_telemetry_fixed WHERE anomaly_flag = 1 GROUP BY machine_name ORDER BY COUNT(*) DESC LIMIT 5;"
  result_check: set

- id: group_04
  category: group_sort
  question: "Πλήθος εγγραφών ανά τύπο βλάβης, εξαιρώντας τις κανονικές."
  gold_sql: "SELECT failure_type, COUNT(*) AS n FROM factory_telemetry_fixed WHERE failure_type <> 'Normal' GROUP BY failure_type ORDER BY n DESC;"
  result_check: set

- id: temporal_01
  category: temporal
  question: "Πώς εξελίχθηκε η μέση θερμοκρασία ανά ημέρα;"
  gold_sql: "SELECT DATE_TRUNC('day', ts) AS day, ROUND(AVG(temperature)::numeric, 2) AS avg_temperature FROM factory_telemetry_fixed GROUP BY day ORDER BY day;"
  result_check: ordered

- id: temporal_02
  category: temporal
  question: "Μέση κατανάλωση ενέργειας ανά ώρα της ημέρας."
  gold_sql: "SELECT EXTRACT(hour FROM ts) AS hour_of_day, ROUND(AVG(energy_consumption)::numeric, 2) AS avg_energy FROM factory_telemetry_fixed GROUP BY hour_of_day ORDER BY hour_of_day;"
  result_check: ordered

- id: temporal_03
  category: temporal
  question: "Ποιος είναι ο μέσος όρος κατανάλωσης ενέργειας την τελευταία εβδομάδα;"
  gold_sql: "SELECT ROUND(AVG(energy_consumption)::numeric, 2) AS avg_energy FROM factory_telemetry_fixed WHERE ts >= (SELECT MAX(ts) FROM factory_telemetry_fixed) - INTERVAL '7 days';"
  result_check: scalar

- id: temporal_04
  category: temporal
  question: "Πόσες ανωμαλίες καταγράφηκαν την τελευταία ημέρα των δεδομένων;"
  gold_sql: "SELECT COUNT(*) AS n FROM factory_telemetry_fixed WHERE anomaly_flag = 1 AND ts::date = (SELECT MAX(ts)::date FROM factory_telemetry_fixed);"
  result_check: scalar

