  gold_sql: "SELECT machine_name FROM factory_telemetry_fixed WHERE ts IN (SELECT MAX(ts) FROM factory_telemetry_fixed GROUP BY machine_id) AND maintenance_required = 1 ORDER BY machine_name;"
  result_check: set

- id: nested_02
  category: nested
  question: "Πόσες μηχανές έχουν αυτή τη στιγμή ενεργή βλάβη;"
  gold_sql: "SELECT COUNT(*) AS n FROM factory_telemetry_fixed WHERE ts IN (SELECT MAX(ts) FROM factory_telemetry_fixed GROUP BY machine_id) AND failure_type <> 'Normal';"
  result_check: scalar

